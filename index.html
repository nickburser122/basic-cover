<style>
:root {
    --radius-card: 28px;
    --radius-badge: 14px;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --font-display: 'Amiri', serif;
    --danger: #B01A3E;
    --danger-soft: rgba(176, 26, 62, 0.10);
}

body.theme-ledger {
    --radius-card: 18px;
    --radius-badge: 8px;
    --font-display: 'Amiri', serif;
    --bg-body: #ECE6D8;
    --text-main: #241C14;
    --text-muted: #4A4030;
    --page-bg: #F7F2E6;
    --page-outline: rgba(74, 64, 48, 0.16);
    --shatb-accent: #7A2331;
    --shatb-card: linear-gradient(155deg, #FCF8EE 0%, #F5EBDA 100%);
    --shatb-border: rgba(122, 35, 49, 0.35);
    --shatb-badge-bg: #7A2331;
    --shatb-badge-fg: #F7F0DF;
    --shatb-glow: rgba(122, 35, 49, 0.12);
    --shatb-wm: rgba(122, 35, 49, 0.38);
    --ohda-accent: #1E3A5F;
    --ohda-card: linear-gradient(155deg, #FCF8EE 0%, #F5EBDA 100%);
    --ohda-border: rgba(30, 58, 95, 0.32);
    --ohda-badge-bg: #1E3A5F;
    --ohda-badge-fg: #F0F4F8;
    --ohda-glow: rgba(30, 58, 95, 0.12);
    --ohda-wm: rgba(30, 58, 95, 0.36);
    --panel-bg: #FBF6EA;
    --panel-ink: #241C14;
    --panel-muted: #7A6E58;
    --panel-line: rgba(74, 64, 48, 0.16);
    --panel-field: #F2E9D8;
    --panel-accent: #7A2331;
}

body.theme-desert {
    --radius-card: 32px;
    --radius-badge: 18px;
    --font-display: 'Cairo', sans-serif;
    --bg-body: #EAD9C2;
    --text-main: #2C2013;
    --text-muted: #5C4B36;
    --page-bg: #F6EBDA;
    --page-outline: rgba(70, 45, 20, 0.13);
    --shatb-accent: #BE5432;
    --shatb-card: linear-gradient(150deg, #FBF3E7 0%, #F3DEC9 50%, #EBC9A9 100%);
    --shatb-border: rgba(190, 84, 50, 0.28);
    --shatb-badge-bg: #BE5432;
    --shatb-badge-fg: #FBF3E7;
    --shatb-glow: rgba(190, 84, 50, 0.16);
    --shatb-wm: rgba(190, 84, 50, 0.38);
    --ohda-accent: #2A6F63;
    --ohda-card: linear-gradient(150deg, #F3FAF7 0%, #DFEFE9 50%, #C9E1D8 100%);
    --ohda-border: rgba(42, 111, 99, 0.26);
    --ohda-badge-bg: #2A6F63;
    --ohda-badge-fg: #F3FAF7;
    --ohda-glow: rgba(42, 111, 99, 0.15);
    --ohda-wm: rgba(42, 111, 99, 0.38);
    --panel-bg: #FBF6EE;
    --panel-ink: #2C2013;
    --panel-muted: #7A6A55;
    --panel-line: rgba(70, 45, 20, 0.15);
    --panel-field: #F1E5D4;
    --panel-accent: #BE5432;
}

body.theme-pearl {
    --radius-card: 26px;
    --radius-badge: 50%;
    --font-display: 'El Messiri', serif;
    --bg-body: #F1F1F5;
    --text-main: #14141A;
    --text-muted: #5B5E68;
    --page-bg: #FFFFFF;
    --page-outline: rgba(0, 0, 0, 0.05);
    --shatb-accent: #C33A5D;
    --shatb-card: linear-gradient(150deg, #FFFFFF 0%, #FBF1F4 55%, #F7E4EA 100%);
    --shatb-border: rgba(195, 58, 93, 0.17);
    --shatb-badge-bg: #C33A5D;
    --shatb-badge-fg: #FFFFFF;
    --shatb-glow: rgba(195, 58, 93, 0.08);
    --shatb-wm: rgba(195, 58, 93, 0.24);
    --ohda-accent: #2F4FBE;
    --ohda-card: linear-gradient(150deg, #FFFFFF 0%, #F0F3FC 55%, #E3E9FA 100%);
    --ohda-border: rgba(47, 79, 190, 0.17);
    --ohda-badge-bg: #2F4FBE;
    --ohda-badge-fg: #FFFFFF;
    --ohda-glow: rgba(47, 79, 190, 0.08);
    --ohda-wm: rgba(47, 79, 190, 0.24);
    --panel-bg: #FFFFFF;
    --panel-ink: #14141A;
    --panel-muted: #6B6F7A;
    --panel-line: rgba(0, 0, 0, 0.07);
    --panel-field: #F5F5F9;
    --panel-accent: #2F4FBE;
}

body {
    --accent-soft: color-mix(in srgb, var(--panel-accent) 13%, transparent);
    --rule: color-mix(in srgb, var(--text-main) 18%, transparent);
}

* { box-sizing: border-box; }

html {
    color-scheme: light;
    scrollbar-width: thin;
    scrollbar-color: rgba(30, 24, 16, 0.26) transparent;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: "IBM Plex Sans Arabic", -apple-system, BlinkMacSystemFont, "SF Pro Arabic", "Segoe UI", sans-serif;
    background: var(--bg-body);
    color: var(--text-main);
    padding: 28px 20px 100px;
    display: flex;
    flex-direction: column;
    align-items: safe center;
    gap: 24px;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    transition: background 0.3s var(--ease-out), color 0.3s var(--ease-out);
}

::selection { background: var(--accent-soft); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
    background: rgba(30, 24, 16, 0.24);
    border: 3px solid transparent;
    border-radius: 10px;
    background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover {
    background: rgba(30, 24, 16, 0.4);
    border: 3px solid transparent;
    background-clip: content-box;
}

button {
    appearance: none;
    -webkit-appearance: none;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    color: inherit;
    cursor: pointer;
    text-align: center;
}

input {
    appearance: none;
    -webkit-appearance: none;
    margin: 0;
    font: inherit;
    color: inherit;
    border-radius: 0;
}

button:focus-visible, input:focus-visible {
    outline: 2px solid var(--panel-accent);
    outline-offset: 2px;
}

.ico {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
}

.ico.solid { fill: currentColor; stroke: none; }

.sr-file {
    position: fixed;
    left: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

.bar {
    position: sticky;
    top: 20px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
}

.pill {
    position: relative;
    display: flex;
    gap: 3px;
    padding: 5px;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(0, 0, 0, 0.05);
    box-shadow: 0 2px 16px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.04);
}

.pill-ind {
    position: absolute;
    top: 5px;
    bottom: 5px;
    left: 0;
    width: 0;
    border-radius: 100px;
    background: #FFFFFF;
    box-shadow: 0 1px 8px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04);
    transition: transform 0.45s var(--ease-out), width 0.45s var(--ease-out);
    z-index: 0;
}

.pill-btn {
    position: relative;
    z-index: 1;
    padding: 7px 16px;
    border-radius: 100px;
    font-size: 8.5pt;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
    transition: color 0.2s var(--ease-out);
}

.pill-btn:hover, .pill-btn.active { color: var(--text-main); }

#stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
}

.page, .doc {
    background: var(--page-bg);
    border: 1px solid var(--page-outline);
    border-radius: 12px;
    box-shadow: 0 8px 28px rgba(20, 29, 51, 0.08);
    transition: background 0.3s var(--ease-out);
    flex-shrink: 0;
    overflow: hidden;
}

.page {
    --sh: 210mm;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 5mm;
    width: 297mm;
    height: 210mm;
    padding: 6mm;
}

body.theme-ledger .page {
    background-image: repeating-linear-gradient(to bottom, transparent 0 27px, rgba(74, 64, 48, 0.06) 27px 28px);
}

.card {
    border-radius: var(--radius-card);
    padding: 11mm 13mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
}

.card.shatb {
    --c-accent: var(--shatb-accent);
    --c-border: var(--shatb-border);
    --c-wm: var(--shatb-wm);
    background: var(--shatb-card);

}

.card.ohda {
    --c-accent: var(--ohda-accent);
    --c-border: var(--ohda-border);
    --c-wm: var(--ohda-wm);

    border: 1px solid var(--ohda-border);
    box-shadow: 0 10px 28px var(--ohda-glow), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}

.seal {
    position: absolute;
    left: 13mm;
    bottom: 11mm;
    width: 15mm;
    height: 15mm;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    color: var(--c-wm);
    border: 1.5px solid var(--c-wm);
    transition: transform 0.2s var(--ease-out);
}

.seal:hover { transform: scale(1.06); }
.seal .ico { width: 17px; height: 17px; }
.seal img { width: 100%; height: 100%; object-fit: contain; padding: 1.8mm; border-radius: 50%; display: block; }

body.theme-ledger .seal { outline: 1.5px solid var(--c-wm); outline-offset: 4px; }
body.theme-desert .seal { border: none; background: radial-gradient(circle at 35% 30%, var(--c-wm), transparent 72%); }

.header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: relative;
    z-index: 2;
    padding-bottom: 8px;

.org-stack { display: flex; flex-direction: column; gap: 3px; }

.org-item {

    letter-spacing: 0.1px;
}

.header-id { display: flex; align-items: center; gap: 10px; }

.pharmacy-name {
    font-size: 10pt;
    font-weight: 700;

    letter-spacing: -0.2px;
}

.pharmacy-number {
    font-size: 13pt;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    width: 36px;
    height: 36px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: var(--radius-badge);
    flex-shrink: 0;
    letter-spacing: -0.3px;
}

.card.shatb .pharmacy-number {
    background: var(--shatb-badge-bg);
    color: var(--shatb-badge-fg);
    box-shadow: 0 4px 12px var(--shatb-glow);
}

.card.ohda .pharmacy-number {
    background: var(--ohda-badge-bg);
    color: var(--ohda-badge-fg);
    box-shadow: 0 4px 12px var(--ohda-glow);
}

.center-content {
    flex-grow: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 2;
}

.main-text {
    font-family: var(--font-display), 'Amiri', serif;
    font-size: 44pt;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-main);
    letter-spacing: -0.02em;
    text-align: center;
    line-height: 1;
    max-width: 100%;
}

body.theme-ledger .main-text { font-size: 41pt; }
body.theme-desert .main-text { font-size: 42pt; }
body.theme-pearl .main-text { font-size: 39pt; }

.footer-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
    z-index: 2;
}

.footer-line {
    display: none;

}

.has-line .footer-line { display: block; }

.footer-text {
    font-size: 8.5pt;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
    letter-spacing: -0.1px;
}

.fiscal-year {
    font-size: 7.1pt;
    font-weight: 600;
    color: var(--text-muted);
    opacity: 0.95;
    white-space: nowrap;
}

.doc {
    --sh: 297mm;
    width: 210mm;
    height: 297mm;
    padding: 22mm 24mm;
    display: flex;
    flex-direction: column;
}

.doc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12mm;
    padding-bottom: 9mm;
    border-bottom: 0.3mm solid var(--rule);
}

.org-info p {
    margin: 0;
    font-size: 12pt;
    font-weight: 500;
    line-height: 2.1;
    color: var(--text-muted);

}

.org-info p:first-child { font-weight: 700; color: var(--text-main); }

.logo-zone {
    width: 40mm;
    height: 34mm;

    border-radius: calc(var(--radius-card) * 0.75);

    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;

}

.logo-zone:hover { border-color: var(--panel-accent); background: var(--accent-soft); color: var(--panel-accent); }
.logo-zone .ico { width: 26px; height: 26px; stroke-width: 1.5; }
.logo-zone.has { border-color: transparent; background: none; }
.logo-zone img { width: 100%; height: 100%; object-fit: contain; padding: 4px; display: block; }

.doc-title {
    margin: 0 0 6mm;
    font-family: var(--font-display), 'Amiri', serif;
    font-size: 20pt;
    font-weight: 700;
    text-align: center;
    line-height: 1.5;
    color: var(--text-main);
}

.doc-subline {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 12mm;
}

.doc-subline i { display: block; width: 36px; height: 1.5px; background: var(--panel-accent); opacity: 0.6; }
.doc-subline span { font-size: 8.5pt; font-weight: 700; color: var(--panel-accent); }

.table-wrap {
    border: 0.3mm solid var(--rule);
    border-radius: calc(var(--radius-card) * 0.7);
    overflow: hidden;
    margin-bottom: 24mm;
}

.table-wrap table { width: 100%; border-collapse: collapse; table-layout: fixed; }

.table-wrap th {
    background: color-mix(in srgb, var(--panel-accent) 9%, #FFFFFF);
    padding: 4mm 2mm;
    font-size: 11.5pt;
    font-weight: 700;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.6;
}

.table-wrap td { border-top: 0.3mm solid var(--rule); padding: 0; }
.table-wrap th + th, .table-wrap td + td { border-inline-start: 0.3mm solid var(--rule); }

.cell {
    height: 22.5mm;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 2mm;
    font-size: 12pt;
    font-weight: 500;
    color: var(--text-main);
    overflow: hidden;
}

.sig { margin-top: 10mm; padding: 0 20mm; }

.sig-top {
    font-family: var(--font-display), 'Amiri', serif;
    font-size: 18pt;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 12mm;
    text-align: right;
}

.sig-bottom { display: flex; justify-content: space-between; align-items: center; }

.sg {
    position: relative;
    padding-bottom: 10px;
    font-family: var(--font-display), 'Amiri', serif;
    font-size: 16.5pt;
    font-weight: 700;
    color: var(--text-muted);
}

.sg::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    left: 0;
    height: 2px;
    border-radius: 4px;
    background: linear-gradient(to left, transparent, var(--panel-accent) 20%, var(--panel-accent) 80%, transparent);
    opacity: 0.55;
}

.editable { cursor: text; border-radius: 6px; transition: background 0.15s var(--ease-out); }
.editable:hover { background: rgba(0, 0, 0, 0.06); }
.editable:empty::before { content: ""; display: inline-block; min-width: 3em; height: 1.2em; }

.inline-edit-input {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    outline: none;
    background: rgba(0, 0, 0, 0.05);
    border-radius: 6px;
    padding: 0 4px;
    font-family: inherit;
    min-width: 0;
    caret-color: var(--panel-accent);
}

.inline-edit-input:focus, .inline-edit-input:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--panel-accent); }

.dock {
    position: fixed;
    bottom: 26px;
    left: 26px;
    z-index: 210;
    display: flex;
    gap: 4px;
    padding: 5px;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(0, 0, 0, 0.05);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14), 0 2px 6px rgba(0, 0, 0, 0.08);
}

.dock-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 18px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
    transition: background 0.2s var(--ease-out), transform 0.2s var(--ease-out), filter 0.2s var(--ease-out);
}

.dock-btn:hover { background: var(--panel-field); }
.dock-btn:active { transform: scale(0.97); }
.dock-btn.primary { background: var(--panel-accent); color: #FFFFFF; }
.dock-btn.primary:hover { background: var(--panel-accent); filter: brightness(1.1); }
.dock-btn .ico { width: 17px; height: 17px; }
.dock-btn span { display: flex; }

.scrim {
    position: fixed;
    inset: 0;
    z-index: 290;
    background: rgba(30, 24, 16, 0.16);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s var(--ease-out);
}

.scrim.open { opacity: 1; pointer-events: auto; }

.panel {
    position: fixed;
    top: 0;
    right: 0;
    height: 100vh;
    height: 100dvh;
    width: 390px;
    max-width: 94vw;
    background: var(--panel-bg);
    color: var(--panel-ink);
    z-index: 300;
    border-left: 1px solid var(--panel-line);
    box-shadow: -24px 0 60px rgba(30, 24, 16, 0.14);
    transform: translateX(100%);
    visibility: hidden;
    transition: transform 0.4s var(--ease-out), visibility 0s 0.4s;
    display: flex;
    flex-direction: column;
}

.panel.open { transform: none; visibility: visible; transition-delay: 0s; }

.panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--panel-line);
    flex-shrink: 0;
}

.panel-title { font-size: 15px; font-weight: 700; }

.icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--panel-field);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s var(--ease-out);
}

.icon-btn:hover { background: var(--panel-line); }
.icon-btn .ico { width: 15px; height: 15px; }

.panel-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 20px 24px;
    scrollbar-width: thin;
    scrollbar-color: rgba(30, 24, 16, 0.24) transparent;
}

.panel-section { margin-bottom: 20px; }
.panel-section-title { font-size: 12px; font-weight: 700; color: var(--panel-muted); margin-bottom: 10px; }

.panel-hint {
    font-size: 12px;
    font-weight: 500;
    color: var(--panel-muted);
    background: var(--panel-field);
    padding: 11px 14px;
    border-radius: 12px;
    line-height: 1.8;
}

.logo-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 14px;
    border: 1px solid var(--panel-line);
}

.logo-thumb {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    border: 1.5px dashed var(--panel-line);
    background: var(--panel-field);
    color: var(--panel-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    transition: border-color 0.15s var(--ease-out), color 0.15s var(--ease-out);
}

.logo-thumb:hover { border-color: var(--panel-accent); color: var(--panel-accent); }
.logo-thumb.has { border-style: solid; background: #FFFFFF; }
.logo-thumb img { width: 100%; height: 100%; object-fit: contain; padding: 3px; display: block; }
.logo-text { flex: 1; min-width: 0; text-align: right; }
.logo-text b { display: block; font-size: 13px; font-weight: 700; }
.logo-text small { display: block; font-size: 11px; font-weight: 500; color: var(--panel-muted); }

.quick-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

.chip {
    padding: 6px 13px;
    border-radius: 100px;
    border: 1px solid var(--panel-line);
    font-size: 12px;
    font-weight: 600;
    color: var(--panel-ink);
    transition: background 0.15s var(--ease-out);
}

.chip:hover { background: var(--panel-field); }

.card-rows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }

.row-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 12px;
    border: 1px solid var(--panel-line);
    background: var(--panel-bg);
    cursor: pointer;
    transition: border-color 0.15s var(--ease-out), background 0.15s var(--ease-out), opacity 0.15s var(--ease-out);
}

.row-item:hover { background: var(--panel-field); }
.row-item.selected { border-color: var(--panel-accent); background: var(--accent-soft); }
.row-item.dragging { opacity: 0.4; }
.row-item.drag-over { border-style: dashed; border-color: var(--panel-accent); }

.drag-handle { display: flex; color: var(--panel-muted); cursor: grab; flex-shrink: 0; }
.drag-handle .ico { width: 14px; height: 14px; }

.check {
    width: 17px;
    height: 17px;
    border-radius: 5px;
    border: 1.5px solid rgba(30, 24, 16, 0.24);
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s var(--ease-out), border-color 0.15s var(--ease-out);
}

.check .ico { width: 11px; height: 11px; stroke: #FFFFFF; stroke-width: 3; opacity: 0; transition: opacity 0.15s var(--ease-out); }
.row-item.selected .check { background: var(--panel-accent); border-color: var(--panel-accent); }
.row-item.selected .check .ico { opacity: 1; }

.row-type-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(30, 24, 16, 0.07);
}

.row-type-dot.shatb { background: var(--shatb-accent); }
.row-type-dot.ohda { background: var(--ohda-accent); }

.row-text { flex: 1; min-width: 0; text-align: right; }

.row-center-preview {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.row-footer-preview {
    font-size: 11px;
    font-weight: 500;
    color: var(--panel-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.row-icon-actions { display: flex; gap: 2px; flex-shrink: 0; }

.mini-btn {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    color: var(--panel-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s var(--ease-out), color 0.15s var(--ease-out);
}

.mini-btn .ico { width: 15px; height: 15px; }
.mini-btn:hover { background: var(--panel-line); color: var(--panel-ink); }
.mini-btn.active { color: var(--panel-accent); background: var(--accent-soft); }
.mini-btn.del:hover { background: var(--danger-soft); color: var(--danger); }

.add-card-btn {
    width: 100%;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: 12px;
    border: 1.5px dashed var(--panel-line);
    color: var(--panel-muted);
    font-size: 13px;
    font-weight: 600;
    transition: border-color 0.15s var(--ease-out), color 0.15s var(--ease-out), background 0.15s var(--ease-out);

.add-card-btn .ico { width: 15px; height: 15px; }
.add-card-btn:hover { border-color: var(--panel-accent); color: var(--panel-accent); background: var(--accent-soft); }

.batch-bar {
    display: grid;
    grid-template-rows: 0fr;
    visibility: hidden;
    flex-shrink: 0;
    background: var(--panel-bg);
    border-top: 1px solid transparent;
    transition: grid-template-rows 0.3s var(--ease-out), visibility 0s 0.3s;
}

.batch-bar.active {
    grid-template-rows: 1fr;

}

.batch-inner { overflow: hidden; min-height: 0; }
.batch-pad { padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 10px; }
.batch-count { font-size: 12px; font-weight: 700; color: var(--panel-accent); }
.seg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--panel-field); }

.seg-btn {
    flex: 1;
    padding: 8px 4px;
    border-radius: 8px;
    font-size: 11.5px;
    font-weight: 600;
    transition: background 0.15s var(--ease-out);
}

.seg-btn:hover { background: var(--panel-line); }
.input-row, .action-row { display: flex; gap: 8px; }

.field {
    flex: 1;
    width: 100%;
    min-width: 0;
    height: 38px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--panel-line);
    background: #FFFFFF;
    color: var(--panel-ink);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out);
}

.field::placeholder { color: var(--panel-muted); }

.field:focus, .field:focus-visible {
    outline: none;
    border-color: var(--panel-accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
}

.btn {
    flex: 1;
    height: 38px;
    padding: 0 14px;
    border-radius: 10px;
    background: var(--panel-field);
    color: var(--panel-ink);
    font-size: 12.5px;
    font-weight: 600;
    transition: background 0.15s var(--ease-out), filter 0.15s var(--ease-out);
}

.btn:hover { background: var(--panel-line); }
.btn.primary { flex: 0 0 auto; background: var(--panel-accent); color: #FFFFFF; }
.btn.primary:hover { background: var(--panel-accent); filter: brightness(1.1); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.danger:hover { background: rgba(176, 26, 62, 0.18); }

.tip {
    position: fixed;
    z-index: 500;
    left: 0;
    top: 0;
    pointer-events: none;
    background: #FFFFFF;
    color: var(--panel-ink);
    border: 1px solid var(--panel-line);
    box-shadow: 0 6px 20px rgba(30, 24, 16, 0.14);
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1;
    padding: 7px 10px;
    border-radius: 8px;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 0.12s var(--ease-out), transform 0.12s var(--ease-out);
}

.tip.show { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; transition-delay: 0s !important; }
}

@media print {
    html, body { width: auto; height: auto; margin: 0; padding: 0; background: #FFFFFF; }
    body { display: block; padding: 0; gap: 0; }
    .no-print { display: none !important; }
    #stage { display: block; zoom: 1 !important; }
    .page, .doc {
        margin: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        background: #FFFFFF !important;
        background-image: none !important;
        height: calc(var(--sh) - 0.3mm);
        break-after: page;
        page-break-after: always;
    }
    .page:last-child, .doc:last-child { break-after: auto; page-break-after: auto; }
    .card { box-shadow: none !important; border-width: 0.3mm; }
    .card.shatb { border-color: color-mix(in srgb, var(--shatb-accent) 55%, transparent); }
    .card.ohda { border-color: color-mix(in srgb, var(--ohda-accent) 55%, transparent); }
    .card .header { border-bottom-color: color-mix(in srgb, var(--c-accent) 45%, transparent); }
    .pharmacy-number { box-shadow: none !important; }
    .footer-line { opacity: 0.8; }
    .editable:hover { background: none !important; }
    .editable:empty::before { display: none; }
    .seal:not(.has), .logo-zone:not(.has) { visibility: hidden; }
    .seal:hover { transform: none; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}
</style>
</head>
<body class="theme-ledger">

<div class="bar no-print">
    <div class="pill" id="modePill">
        <div class="pill-ind"></div>
        <button type="button" class="pill-btn active" data-mode="cards">البطاقات</button>
        <button type="button" class="pill-btn" data-mode="form">الإقرار</button>
    </div>
    <div class="pill" id="themePill">
        <div class="pill-ind"></div>
        <button type="button" class="pill-btn active" data-theme="theme-ledger">دفتري</button>
        <button type="button" class="pill-btn" data-theme="theme-desert">صحراء</button>
        <button type="button" class="pill-btn" data-theme="theme-pearl">لؤلؤي</button>
    </div>
</div>

<main id="stage"></main>

<div class="dock no-print">
    <button type="button" class="dock-btn" id="openPanel"><span data-icon="sliders"></span><span>تخصيص</span></button>
    <button type="button" class="dock-btn primary" id="printBtn"><span data-icon="print"></span><span>طباعة</span></button>

<aside class="panel no-print" id="panel" aria-hidden="true">

</aside>

<div class="tip no-print" id="tip"></div>
<input type="file" class="sr-file" id="logoInput" accept="image/*" tabindex="-1" aria-hidden="true">

<script>
const svg = (d, c = '') => `<svg class="ico ${c}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;

const I = {
    sliders: svg('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'),
    print: svg('<path d="M7 9V4h10v5"/><path d="M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="6" rx="1"/>'),
    close: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
    check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
    line: svg('<path d="M5 12h14"/>'),
    dup: svg('<rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'),
    del: svg('<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    upload: svg('<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>'),
    image: svg('<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>'),
    drag: svg('<circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/>', 'solid')
};

const THEMES = ['theme-ledger', 'theme-desert', 'theme-pearl'];
const STORE_KEY = 'shamela.v3';

function defaults() {
    return {
        mode: 'cards',
        theme: 'theme-ledger',
        identity: {
            org: ['الهيئة العامة للتأمين الصحي', 'فرع البحيرة - ادارة المنطقة الثانية', 'عيادة دمنهور الشاملة'],
            pharmacyName: 'صيدلية دمنهور الشاملة',
            pharmacyNumber: '2',
            fiscalYear: 'عن العام المالي 2026-2027',
            logo: null
        },
        cards: [
            { type: 'shatb', center: '114 شطب', footer: 'نموذج 5 م.ح', hasLine: false },
            { type: 'shatb', center: 'شطب A', footer: 'دفتر 322', hasLine: false },
            { type: 'shatb', center: 'شطب B', footer: 'دفتر 322', hasLine: false },
            { type: 'shatb', center: 'شطب C', footer: 'دفتر 322', hasLine: false },
            { type: 'shatb', center: 'شطب A', footer: 'سجل 4 م.ح', hasLine: false },
            { type: 'shatb', center: 'شطب B', footer: 'سجل 4 م.ح', hasLine: false },
            { type: 'shatb', center: 'شطب C', footer: 'سجل 4 م.ح', hasLine: false },
            { type: 'ohda', center: '114 عهدة', footer: 'نموذج 5 م.ح', hasLine: false },
            { type: 'ohda', center: 'عهدة A', footer: 'دفتر 322', hasLine: false },
            { type: 'ohda', center: 'عهدة B', footer: 'دفتر 322', hasLine: false },
            { type: 'ohda', center: 'عهدة C', footer: 'دفتر 322', hasLine: false },
            { type: 'ohda', center: 'عهدة A', footer: 'سجل 3 م.ح', hasLine: true },
            { type: 'ohda', center: 'عهدة B', footer: 'سجل 3 م.ح', hasLine: true },
            { type: 'ohda', center: 'عهدة C', footer: 'سجل 3 م.ح', hasLine: true }
        ].map(c => Object.assign(c, { selected: false })),
        form: {
            title: 'إقرار فتح دفتر',
            subline: 'سجلات الصيدلية',
            row: ['', '', '', ''],
            declare: 'المقر بما فيه',
            sign: ['الاسم', 'التوقيع']
        }
    };
}

const str = (v, d) => (typeof v === 'string' ? v : d);

function restore(raw) {
    const d = defaults();
    let s;
    try { s = JSON.parse(raw); } catch (e) { return d; }
    if (!s || typeof s !== 'object') return d;
    if (s.mode === 'cards' || s.mode === 'form') d.mode = s.mode;
    if (THEMES.includes(s.theme)) d.theme = s.theme;
    const i = s.identity;
    if (i && typeof i === 'object') {
        if (Array.isArray(i.org)) d.identity.org = d.identity.org.map((v, n) => str(i.org[n], v));
        d.identity.pharmacyName = str(i.pharmacyName, d.identity.pharmacyName);
        d.identity.pharmacyNumber = str(i.pharmacyNumber, d.identity.pharmacyNumber);
        d.identity.fiscalYear = str(i.fiscalYear, d.identity.fiscalYear);
        d.identity.logo = typeof i.logo === 'string' && i.logo.startsWith('data:image/') ? i.logo : null;
    }
    if (Array.isArray(s.cards)) {
        const list = s.cards
            .filter(c => c && (c.type === 'shatb' || c.type === 'ohda'))
            .map(c => ({ type: c.type, center: str(c.center, ''), footer: str(c.footer, ''), hasLine: !!c.hasLine, selected: false }));
        if (list.length || !s.cards.length) d.cards = list;
    }
    const f = s.form;
    if (f && typeof f === 'object') {
        d.form.title = str(f.title, d.form.title);
        d.form.subline = str(f.subline, d.form.subline);
        d.form.declare = str(f.declare, d.form.declare);
        if (Array.isArray(f.row)) d.form.row = d.form.row.map((v, n) => str(f.row[n], v));
        if (Array.isArray(f.sign)) d.form.sign = d.form.sign.map((v, n) => str(f.sign[n], v));
    }
    return d;
}

let state;
try {
    const raw = localStorage.getItem(STORE_KEY);
    state = raw ? restore(raw) : defaults();
} catch (e) {
    state = defaults();
}

let dragSrc = null;
let saveTimer = null;
let tipTarget = null;

const $ = id => document.getElementById(id);
const stage = $('stage');
const panelEl = $('panel');
const scrimEl = $('scrim');
const tipEl = $('tip');
const logoInput = $('logoInput');

const esc = s => String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

function pathGet(path) {
    let o = state;
    for (const k of path.split('.')) {
        if (o == null) return '';
        o = o[k];
    }
    return o == null ? '' : o;
}

function pathSet(path, val) {
    const keys = path.split('.');
    let o = state;
    for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
    o[keys[keys.length - 1]] = val;
}

function persist() {
    try {
        localStorage.setItem(STORE_KEY, JSON.stringify(state, (k, v) => (k === 'selected' ? undefined : v)));
    } catch (e) {}
}

function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
        saveTimer = null;
        persist();
    }, 250);
}

function flushSave() {
    if (saveTimer === null) return;
    clearTimeout(saveTimer);
    saveTimer = null;
    persist();
}

const ed = (path, cls, tag = 'div', extra = '') =>
    `<${tag} class="${cls ? cls + ' ' : ''}editable" data-p="${path}"${extra}>${esc(pathGet(path))}</${tag}>`;

function cardHTML(c, i) {
    const L = state.identity.logo;
    const seal = L
        ? `<button type="button" class="seal has" data-logo data-tip="تغيير الشعار"><img src="${esc(L)}" alt=""></button>`
        : `<button type="button" class="seal" data-logo data-tip="رفع الشعار">${I.image}</button>`;
    return `
    <div class="card ${c.type}">
        ${seal}
        <div class="header">
            <div class="org-stack">
                ${[0, 1, 2].map(n => ed(`identity.org.${n}`, 'org-item')).join('')}
            </div>
            <div class="header-id">
                ${ed('identity.pharmacyName', 'pharmacy-name')}
                ${ed('identity.pharmacyNumber', 'pharmacy-number')}
            </div>
        </div>
        <div class="center-content">${ed(`cards.${i}.center`, 'main-text')}</div>
        <div class="footer-wrapper${c.hasLine ? ' has-line' : ''}">
            <div class="footer-line"></div>
            ${ed(`cards.${i}.footer`, 'footer-text')}
            ${ed('identity.fiscalYear', 'fiscal-year')}
        </div>
    </div>`;
}

function cardsHTML() {
    let out = '';
    for (let i = 0; i < state.cards.length; i += 4) {
        out += `<section class="page">${state.cards.slice(i, i + 4).map((c, j) => cardHTML(c, i + j)).join('')}</section>`;
    }
    return out || '<section class="page"></section>';
}

function formHTML() {
    const L = state.identity.logo;
    const zone = L
        ? `<button type="button" class="logo-zone has" data-logo data-tip="تغيير الشعار"><img src="${esc(L)}" alt=""></button>`
        : `<button type="button" class="logo-zone" data-logo>${I.upload}<span>الشعار</span></button>`;
    const cols = ['اسم المخزن', 'اسم الدفتر', 'نوع الدفتر<br>(عهدة / شطب)', 'عدد الصفحات'];
    const widths = [28, 28, 28, 16];
    return `
    <section class="doc">
        <div class="doc-header">
            <div class="org-info">
                ${ed('identity.org.0', '', 'p')}
                ${ed('identity.org.1', '', 'p')}
                <p>${ed('identity.pharmacyName', '', 'span')} ${ed('identity.pharmacyNumber', '', 'span')}</p>
            </div>
            ${zone}
        </div>
        <h1 class="doc-title">${ed('form.title', '', 'span')} ${ed('identity.fiscalYear', '', 'span')}</h1>
        <div class="doc-subline"><i></i>${ed('form.subline', '', 'span')}<i></i></div>
        <div class="table-wrap">
            <table>
                <thead><tr>${cols.map((t, i) => `<th style="width:${widths[i]}%">${t}</th>`).join('')}</tr></thead>
                <tbody><tr>${[0, 1, 2, 3].map(i => `<td>${ed(`form.row.${i}`, 'cell', 'div', ' data-fill')}</td>`).join('')}</tr></tbody>
            </table>
        </div>
        <div class="sig">
            ${ed('form.declare', 'sig-top')}
            <div class="sig-bottom">
                ${[0, 1].map(i => `<div class="sg">${ed(`form.sign.${i}`, '', 'span')}</div>`).join('')}
            </div>
        </div>
    </section>`;
}

function fit() {
    const w = (state.mode === 'cards' ? 297 : 210) * 96 / 25.4;
    const avail = document.documentElement.clientWidth - 40;
    stage.style.zoom = Math.min(1, avail / w);
}

function setTitle() {
    document.title = state.mode === 'cards'
        ? 'الشاملة — بطاقات'
        : `${state.form.title} ${state.identity.fiscalYear}`;
}

function renderStage() {
    $('pageSize').textContent = `@page { size: ${state.mode === 'cards' ? '297mm 210mm' : '210mm 297mm'}; margin: 0; }`;
    stage.innerHTML = state.mode === 'cards' ? cardsHTML() : formHTML();
    setTitle();
}

function refresh() {
    renderStage();
    fit();
    save();
}

function refreshAll() {
    refresh();
    renderPanel();
}

function showTip(t) {
    tipTarget = t;
    tipEl.textContent = t.dataset.tip;
    tipEl.style.left = '0px';
    tipEl.style.top = '0px';
    const r = t.getBoundingClientRect();
    const w = tipEl.offsetWidth;
    const h = tipEl.offsetHeight;
    let x = r.left + r.width / 2 - w / 2;
    x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
    let y = r.top - h - 8;
    if (y < 8) y = r.bottom + 8;
    tipEl.style.left = x + 'px';
    tipEl.style.top = y + 'px';
    tipEl.classList.add('show');
}

function hideTip() {
    tipTarget = null;
    tipEl.classList.remove('show');
}

document.addEventListener('mouseover', e => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t) { if (t !== tipTarget) showTip(t); }
    else if (tipTarget) hideTip();
});
document.addEventListener('focusin', e => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t && e.target.matches(':focus-visible')) showTip(t);
});
document.addEventListener('focusout', hideTip);
document.addEventListener('mousedown', hideTip);
document.addEventListener('dragstart', hideTip);
window.addEventListener('scroll', hideTip, true);

function paintIcons() {
    document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = I[el.dataset.icon]; });
}

function moveInd(pill) {
    const b = pill.querySelector('.pill-btn.active');
    const ind = pill.querySelector('.pill-ind');
    if (!b || !ind) return;
    const pr = pill.getBoundingClientRect();
    const r = b.getBoundingClientRect();
    ind.style.width = r.width + 'px';
    ind.style.transform = `translateX(${r.left - pr.left - pill.clientLeft}px)`;
}

function moveAllInd() {
    document.querySelectorAll('.pill').forEach(moveInd);
}

function beginEdit(el) {
    const p = el.dataset.p;
    const fill = el.hasAttribute('data-fill');
    const cs = getComputedStyle(el);
    const input = document.createElement('input');
    input.type = 'text';
    input.value = String(pathGet(p));
    input.className = 'inline-edit-input';
    input.autocomplete = 'off';
    input.spellcheck = false;
    ['fontFamily', 'fontSize', 'fontWeight', 'color', 'textAlign', 'letterSpacing', 'lineHeight'].forEach(k => { input.style[k] = cs[k]; });
    input.style.direction = 'rtl';
    input.style.width = (fill ? el.offsetWidth : Math.max(el.offsetWidth + 24, 48)) + 'px';
    if (fill) input.style.height = el.offsetHeight + 'px';
    else input.style.maxWidth = '100%';

    const commit = () => {
        const v = input.value;
        pathSet(p, v);
        el.textContent = v;
        stage.querySelectorAll('[data-p]').forEach(n => { if (n.dataset.p === p) n.textContent = v; });
        if (input.isConnected) input.replaceWith(el);
        setTitle();
        renderPanel();
        save();
    };

    input.addEventListener('blur', commit, { once: true });
    input.addEventListener('keydown', e => {
        if (e.isComposing) return;
        if (e.key === 'Enter') {
            e.preventDefault();
            input.blur();
        } else if (e.key === 'Escape') {
            e.preventDefault();
            e.stopPropagation();
            input.removeEventListener('blur', commit);
            input.replaceWith(el);
        }
    });

    el.replaceWith(input);
    input.focus();
    input.select();
}

stage.addEventListener('click', e => {
    if (e.target.closest('[data-logo]')) {
        hideTip();
        logoInput.click();
        return;
    }
    const el = e.target.closest('.editable');
    if (el) beginEdit(el);
});

function logoFromFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const setLogo = url => {
        state.identity.logo = url;
        refreshAll();
    };
    if (file.type === 'image/svg+xml') {
        const fr = new FileReader();
        fr.onload = () => setLogo(fr.result);
        fr.readAsDataURL(file);
        return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
        const k = Math.min(1, 640 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * k));
        c.height = Math.max(1, Math.round(img.naturalHeight * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        setLogo(c.toDataURL('image/png'));
    };
    img.onerror = () => URL.revokeObjectURL(url);
    img.src = url;
}

logoInput.addEventListener('change', () => {
    logoFromFile(logoInput.files[0]);
    logoInput.value = '';
});

function logoSectionHTML() {
    const L = state.identity.logo;
    return `
        <div class="panel-section">
            <div class="panel-section-title">الشعار</div>
            <div class="logo-row">
                <button type="button" class="logo-thumb${L ? ' has' : ''}" data-act="logo-pick" data-tip="${L ? 'استبدال' : 'رفع الشعار'}">${L ? `<img src="${esc(L)}" alt="">` : I.image}</button>
                <div class="logo-text"><b>${L ? 'تم رفع الشعار' : 'بدون شعار'}</b><small>يظهر في البطاقات والإقرار</small></div>
                <div class="row-icon-actions">
                    <button type="button" class="mini-btn" data-act="logo-pick" data-tip="${L ? 'استبدال' : 'رفع'}">${I.upload}</button>
                    ${L ? `<button type="button" class="mini-btn del" data-act="logo-clear" data-tip="إزالة">${I.del}</button>` : ''}
                </div>
            </div>
        </div>`;
}

function cardsSectionHTML() {
    const rows = state.cards.map((c, i) => `
        <div class="row-item${c.selected ? ' selected' : ''}" draggable="true" data-i="${i}">
            <span class="drag-handle" data-tip="سحب لإعادة الترتيب">${I.drag}</span>
            <span class="check">${I.check}</span>
            <button type="button" class="row-type-dot ${c.type}" data-act="type" data-tip="تبديل النوع"></button>
            <div class="row-text">
                <div class="row-center-preview">${esc(c.center) || 'بدون نص'}</div>
                <div class="row-footer-preview">${esc(c.footer)}</div>
            </div>
            <div class="row-icon-actions">
                <button type="button" class="mini-btn${c.hasLine ? ' active' : ''}" data-act="line" data-tip="خط فاصل">${I.line}</button>
                <button type="button" class="mini-btn" data-act="dup" data-tip="تكرار">${I.dup}</button>
                <button type="button" class="mini-btn del" data-act="del" data-tip="حذف">${I.del}</button>
            </div>
        </div>`).join('');
    return `
        <div class="panel-section"><div class="panel-hint">انقر على أي نص داخل المعاينة لتعديله مباشرة</div></div>
        <div class="panel-section">
            <div class="panel-section-title">البطاقات (${state.cards.length})</div>
            <div class="quick-filters">
                <button type="button" class="chip" data-act="q" data-q="all">تحديد الكل</button>
                <button type="button" class="chip" data-act="q" data-q="shatb">شطب فقط</button>
                <button type="button" class="chip" data-act="q" data-q="ohda">عهدة فقط</button>
                <button type="button" class="chip" data-act="q" data-q="none">إلغاء التحديد</button>
            </div>
            <div class="card-rows">${rows}</div>
            <button type="button" class="add-card-btn" data-act="add">${I.plus}<span>إضافة بطاقة</span></button>
        </div>`;
}

function renderPanel() {
    hideTip();
    const body = $('panelBody');
    const sc = body.scrollTop;
    body.innerHTML = logoSectionHTML() + (state.mode === 'cards' ? cardsSectionHTML() : '');
    body.scrollTop = sc;
    updateBatchBar();
}

function updateBatchBar() {
    const bar = $('batchBar');
    const inner = $('batchInner');
    const sel = state.cards.filter(c => c.selected);
    if (state.mode !== 'cards' || sel.length === 0) {
        bar.classList.remove('active');
        return;
    }
    bar.classList.add('active');
    inner.innerHTML = `
        <div class="batch-pad">
            <div class="batch-count">${sel.length} بطاقة محددة</div>
            <div class="seg-row">
                <div class="seg">
                    <button type="button" class="seg-btn" data-batch="type" data-v="shatb">شطب</button>
                    <button type="button" class="seg-btn" data-batch="type" data-v="ohda">عهدة</button>
                </div>
                <div class="seg">
                    <button type="button" class="seg-btn" data-batch="line" data-v="show">إظهار الخط</button>
                    <button type="button" class="seg-btn" data-batch="line" data-v="hide">إخفاء الخط</button>
                </div>
            </div>
            <div class="input-row">
                <input type="text" class="field" id="batchFooterInput" placeholder="نص أسفل البطاقة للمحدد" autocomplete="off" spellcheck="false">
                <button type="button" class="btn primary" data-batch="footer">تطبيق</button>
            </div>
            <div class="action-row">
                <button type="button" class="btn" data-batch="dup">تكرار المحدد</button>
                <button type="button" class="btn danger" data-batch="del">حذف المحدد</button>
            </div>
        </div>`;
}

function applyBatch(kind, v) {
    if (kind === 'type') state.cards.forEach(c => { if (c.selected) c.type = v; });
    else if (kind === 'line') state.cards.forEach(c => { if (c.selected) c.hasLine = v === 'show'; });
    else if (kind === 'footer') {
        const val = $('batchFooterInput').value;
        if (!val) return;
        state.cards.forEach(c => { if (c.selected) c.footer = val; });
    } else if (kind === 'dup') {
        const next = [];
        state.cards.forEach(c => {
            next.push(c);
            if (c.selected) next.push(Object.assign({}, c, { selected: false }));
        });
        next.forEach(c => { c.selected = false; });
        state.cards = next;
    } else if (kind === 'del') {
        state.cards = state.cards.filter(c => !c.selected);
    }
    refreshAll();
}

function panelAction(act) {
    const a = act.dataset.act;
    const row = act.closest('[data-i]');
    const i = row ? +row.dataset.i : -1;
    const cards = state.cards;
    if (a === 'type') cards[i].type = cards[i].type === 'shatb' ? 'ohda' : 'shatb';
    else if (a === 'line') cards[i].hasLine = !cards[i].hasLine;
    else if (a === 'dup') cards.splice(i + 1, 0, Object.assign({}, cards[i], { selected: false }));
    else if (a === 'del') cards.splice(i, 1);
    else if (a === 'add') cards.push({ type: 'shatb', center: 'بطاقة جديدة', footer: '', hasLine: false, selected: false });
    else if (a === 'q') {
        const q = act.dataset.q;
        cards.forEach(c => { c.selected = q === 'all' ? true : (q === 'none' ? false : c.type === q); });
        renderPanel();
        return;
    } else if (a === 'logo-pick') {
        logoInput.click();
        return;
    } else if (a === 'logo-clear') state.identity.logo = null;
    refreshAll();
}

const panelBody = $('panelBody');

panelBody.addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act) {
        panelAction(act);
        return;
    }
    const row = e.target.closest('.row-item');
    if (row) {
        const c = state.cards[+row.dataset.i];
        c.selected = !c.selected;
        renderPanel();
    }
});

panelBody.addEventListener('dragstart', e => {
    const r = e.target.closest && e.target.closest('.row-item');
    if (!r) return;
    dragSrc = +r.dataset.i;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(dragSrc));
    r.classList.add('dragging');
});

panelBody.addEventListener('dragover', e => {
    const r = e.target.closest && e.target.closest('.row-item');
    if (!r || dragSrc === null) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    panelBody.querySelectorAll('.drag-over').forEach(x => { if (x !== r) x.classList.remove('drag-over'); });
    r.classList.add('drag-over');
});

panelBody.addEventListener('drop', e => {
    const r = e.target.closest && e.target.closest('.row-item');
    if (!r || dragSrc === null) return;
    e.preventDefault();
    const to = +r.dataset.i;
    const from = dragSrc;
    dragSrc = null;
    if (from === to) {
        renderPanel();
        return;
    }
    const [moved] = state.cards.splice(from, 1);
    state.cards.splice(to, 0, moved);
    refreshAll();
});

panelBody.addEventListener('dragend', () => {
    dragSrc = null;
    panelBody.querySelectorAll('.row-item').forEach(r => r.classList.remove('dragging', 'drag-over'));
});

$('batchBar').addEventListener('click', e => {
    const b = e.target.closest('[data-batch]');
    if (b) applyBatch(b.dataset.batch, b.dataset.v);
});

$('batchBar').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'batchFooterInput') {
        e.preventDefault();
        applyBatch('footer');
    }
});

const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');

document.addEventListener('dragover', e => {
    if (hasFiles(e)) e.preventDefault();
});

document.addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    logoFromFile(e.dataTransfer.files[0]);
});

function applyTheme() {
    document.body.className = state.theme;
    document.querySelectorAll('#themePill .pill-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === state.theme));
    moveInd($('themePill'));
}

function applyMode() {
    document.querySelectorAll('#modePill .pill-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
    refreshAll();
    moveInd($('modePill'));
}

$('themePill').addEventListener('click', e => {
    const b = e.target.closest('.pill-btn');
    if (!b) return;
    state.theme = b.dataset.theme;
    applyTheme();
    save();
});

$('modePill').addEventListener('click', e => {
    const b = e.target.closest('.pill-btn');
    if (!b || b.dataset.mode === state.mode) return;
    state.mode = b.dataset.mode;
    applyMode();
});

function openPanel() {
    panelEl.classList.add('open');
    panelEl.setAttribute('aria-hidden', 'false');
    scrimEl.classList.add('open');
    $('panelClose').focus();
}

function closePanel() {
    panelEl.classList.remove('open');
    panelEl.setAttribute('aria-hidden', 'true');
    scrimEl.classList.remove('open');
    hideTip();
    $('openPanel').focus();
}

$('openPanel').addEventListener('click', openPanel);
$('panelClose').addEventListener('click', closePanel);
scrimEl.addEventListener('click', closePanel);

document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && panelEl.classList.contains('open')) closePanel();
});

$('printBtn').addEventListener('click', () => {
    const a = document.activeElement;
    if (a && a.classList.contains('inline-edit-input')) a.blur();
    hideTip();
    const go = () => window.print();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go);
    else go();
});

window.addEventListener('resize', () => {
    fit();
    moveAllInd();
});
window.addEventListener('load', moveAllInd);
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushSave();
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveAllInd);

paintIcons();
applyTheme();
document.querySelectorAll('#modePill .pill-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
refreshAll();
moveAllInd();
</script>
</body>
</html>
