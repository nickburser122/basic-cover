<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الشاملة — بطاقات</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&family=El+Messiri:wght@400;500;600;700&display=swap');

:root {
    --radius-card: 28px;
    --radius-badge: 14px;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --font-display: 'Amiri', serif;
}

body.theme-ledger {
    --radius-card: 18px;
    --radius-badge: 8px;
    --font-display: 'Amiri', serif;
    --bg-body: #ECE6D8;
    --text-main: #241C14;
    --text-muted: #4A4030;
    --page-bg: #F7F2E6;
    --page-outline: rgba(74, 64, 48, 0.16);
    --shatb-accent: #7A2331;
    --shatb-card: linear-gradient(155deg, #FCF8EE 0%, #F5EBDA 100%);
    --shatb-border: rgba(122, 35, 49, 0.35);
    --shatb-badge-bg: #7A2331;
    --shatb-badge-fg: #F7F0DF;
    --shatb-glow: rgba(122, 35, 49, 0.12);
    --shatb-wm: rgba(122, 35, 49, 0.38);
    --ohda-accent: #1E3A5F;
    --ohda-card: linear-gradient(155deg, #FCF8EE 0%, #F5EBDA 100%);
    --ohda-border: rgba(30, 58, 95, 0.32);
    --ohda-badge-bg: #1E3A5F;
    --ohda-badge-fg: #F0F4F8;
    --ohda-glow: rgba(30, 58, 95, 0.12);
    --ohda-wm: rgba(30, 58, 95, 0.36);
    --panel-bg: #FBF6EA;
    --panel-ink: #241C14;
    --panel-muted: #7A6E58;
    --panel-line: rgba(74, 64, 48, 0.16);
    --panel-field: #F2E9D8;
    --panel-accent: #7A2331;
}

body.theme-seal {
    --radius-card: 24px;
    --radius-badge: 50%;
    --font-display: 'Reem Kufi', sans-serif;
    --bg-body: #10131A;
    --text-main: #F2EFE8;
    --text-muted: #B9B2A4;
    --page-bg: #171B24;
    --page-outline: rgba(255, 255, 255, 0.07);
    --shatb-accent: #C9A227;
    --shatb-card: linear-gradient(160deg, #1C2029 0%, #241C18 55%, #2E2015 100%);
    --shatb-border: rgba(201, 162, 39, 0.35);
    --shatb-badge-bg: #C9A227;
    --shatb-badge-fg: #171308;
    --shatb-glow: rgba(201, 162, 39, 0.18);
    --shatb-wm: rgba(201, 162, 39, 0.45);
    --ohda-accent: #2F9E82;
    --ohda-card: linear-gradient(160deg, #1A1F27 0%, #16241F 55%, #123028 100%);
    --ohda-border: rgba(47, 158, 130, 0.32);
    --ohda-badge-bg: #2F9E82;
    --ohda-badge-fg: #08201A;
    --ohda-glow: rgba(47, 158, 130, 0.16);
    --ohda-wm: rgba(47, 158, 130, 0.42);
    --panel-bg: #171B24;
    --panel-ink: #F2EFE8;
    --panel-muted: #8B8577;
    --panel-line: rgba(255, 255, 255, 0.09);
    --panel-field: #1E232C;
    --panel-accent: #C9A227;
}

body.theme-desert {
    --radius-card: 32px;
    --radius-badge: 18px;
    --font-display: 'Cairo', sans-serif;
    --bg-body: #EAD9C2;
    --text-main: #2C2013;
    --text-muted: #5C4B36;
    --page-bg: #F6EBDA;
    --page-outline: rgba(70, 45, 20, 0.13);
    --shatb-accent: #BE5432;
    --shatb-card: linear-gradient(150deg, #FBF3E7 0%, #F3DEC9 50%, #EBC9A9 100%);
    --shatb-border: rgba(190, 84, 50, 0.28);
    --shatb-badge-bg: #BE5432;
    --shatb-badge-fg: #FBF3E7;
    --shatb-glow: rgba(190, 84, 50, 0.16);
    --shatb-wm: rgba(190, 84, 50, 0.38);
    --ohda-accent: #2A6F63;
    --ohda-card: linear-gradient(150deg, #F3FAF7 0%, #DFEFE9 50%, #C9E1D8 100%);
    --ohda-border: rgba(42, 111, 99, 0.26);
    --ohda-badge-bg: #2A6F63;
    --ohda-badge-fg: #F3FAF7;
    --ohda-glow: rgba(42, 111, 99, 0.15);
    --ohda-wm: rgba(42, 111, 99, 0.38);
    --panel-bg: #FBF6EE;
    --panel-ink: #2C2013;
    --panel-muted: #7A6A55;
    --panel-line: rgba(70, 45, 20, 0.15);
    --panel-field: #F1E5D4;
    --panel-accent: #BE5432;
}

body.theme-pearl {
    --radius-card: 26px;
    --radius-badge: 50%;
    --font-display: 'El Messiri', serif;
    --bg-body: #F1F1F5;
    --text-main: #14141A;
    --text-muted: #5B5E68;
    --page-bg: #FFFFFF;
    --page-outline: rgba(0, 0, 0, 0.05);
    --shatb-accent: #C33A5D;
    --shatb-card: linear-gradient(150deg, #FFFFFF 0%, #FBF1F4 55%, #F7E4EA 100%);
    --shatb-border: rgba(195, 58, 93, 0.17);
    --shatb-badge-bg: #C33A5D;
    --shatb-badge-fg: #FFFFFF;
    --shatb-glow: rgba(195, 58, 93, 0.08);
    --shatb-wm: rgba(195, 58, 93, 0.24);
    --ohda-accent: #2F4FBE;
    --ohda-card: linear-gradient(150deg, #FFFFFF 0%, #F0F3FC 55%, #E3E9FA 100%);
    --ohda-border: rgba(47, 79, 190, 0.17);
    --ohda-badge-bg: #2F4FBE;
    --ohda-badge-fg: #FFFFFF;
    --ohda-glow: rgba(47, 79, 190, 0.08);
    --ohda-wm: rgba(47, 79, 190, 0.24);
    --panel-bg: #FFFFFF;
    --panel-ink: #14141A;
    --panel-muted: #6B6F7A;
    --panel-line: rgba(0, 0, 0, 0.07);
    --panel-field: #F5F5F9;
    --panel-accent: #2F4FBE;
}

* { box-sizing: border-box; }

html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: "IBM Plex Sans Arabic", -apple-system, BlinkMacSystemFont, "SF Pro Arabic", "Segoe UI", sans-serif;
    background: var(--bg-body);
    color: var(--text-main);
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    transition: background 0.3s var(--ease-out), color 0.3s var(--ease-out);
}

.theme-switcher {
    position: sticky;
    top: 20px;
    z-index: 100;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 5px;
    border-radius: 100px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.04);
    display: flex;
    gap: 3px;
    border: 1px solid rgba(0,0,0,0.05);
}

body.theme-seal .theme-switcher {
    background: rgba(30,27,34,0.85);
    border-color: rgba(255,255,255,0.08);
}

.theme-indicator {
    position: absolute;
    top: 5px;
    bottom: 5px;
    left: 0;
    width: 0;
    border-radius: 100px;
    background: #ffffff;
    box-shadow: 0 1px 8px rgba(0,0,0,0.1), 0 0 0 0.5px rgba(0,0,0,0.03);
    transition: transform 0.45s var(--ease-out), width 0.45s var(--ease-out);
    z-index: 0;
}

body.theme-seal .theme-indicator {
    background: #2B2733;
    box-shadow: 0 1px 8px rgba(0,0,0,0.3), 0 0 0 0.5px rgba(255,255,255,0.04);
}

.theme-btn {
    position: relative;
    z-index: 1;
    background: transparent;
    border: none;
    padding: 7px 16px;
    border-radius: 100px;
    font-family: inherit;
    font-size: 8.5pt;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: color 0.2s var(--ease-out);
    letter-spacing: -0.1px;
}

.theme-btn:hover { color: var(--text-main); }
.theme-btn:focus-visible {
    outline: 2px solid var(--panel-accent);
    outline-offset: 2px;
}
.theme-btn.active { color: var(--text-main); }

.page {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 5mm;
    width: 297mm;
    height: 210mm;
    padding: 6mm;
    background: var(--page-bg);
    border: 1px solid var(--page-outline);
    border-radius: 12px;
    box-shadow: 0 8px 28px rgba(20, 29, 51, 0.08);
    transition: background 0.3s var(--ease-out);
}

body.theme-ledger .page {
    background-image: repeating-linear-gradient(to bottom, transparent 0 27px, rgba(74,64,48,0.06) 27px 28px);
}

.card {
    border-radius: var(--radius-card);
    padding: 11mm 13mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
}

.card.shatb {
    background: var(--shatb-card);
    border: 1px solid var(--shatb-border);
    box-shadow: 0 10px 28px var(--shatb-glow), inset 0 1px 0 rgba(255,255,255,0.5);
}

.card.ohda {
    background: var(--ohda-card);
    border: 1px solid var(--ohda-border);
    box-shadow: 0 10px 28px var(--ohda-glow), inset 0 1px 0 rgba(255,255,255,0.5);
}

.wm {
    position: absolute;
    bottom: -34px;
    left: -34px;
    width: 128px;
    height: 128px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display), 'Amiri', serif;
    font-size: 50pt;
    font-weight: 700;
    pointer-events: none;
    user-select: none;
    z-index: 0;
    line-height: 1;
    padding-bottom: 6px;
}

.card.shatb .wm { color: var(--shatb-wm); border: 1.5px solid var(--shatb-wm); }
.card.ohda .wm { color: var(--ohda-wm); border: 1.5px solid var(--ohda-wm); }

body.theme-ledger .card.shatb .wm { outline: 1.5px solid var(--shatb-wm); outline-offset: 5px; }
body.theme-ledger .card.ohda .wm { outline: 1.5px solid var(--ohda-wm); outline-offset: 5px; }

body.theme-seal .card.shatb .wm { border: none; box-shadow: 0 0 0 2px var(--shatb-wm) inset, 0 0 26px var(--shatb-wm); }
body.theme-seal .card.ohda .wm { border: none; box-shadow: 0 0 0 2px var(--ohda-wm) inset, 0 0 26px var(--ohda-wm); }

body.theme-desert .card.shatb .wm { border: none; background: radial-gradient(circle at 35% 30%, var(--shatb-wm), transparent 72%); }
body.theme-desert .card.ohda .wm { border: none; background: radial-gradient(circle at 35% 30%, var(--ohda-wm), transparent 72%); }

.header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: relative;
    z-index: 2;
    padding-bottom: 8px;
}

.card.shatb .header { border-bottom: 1px solid var(--shatb-border); }
.card.ohda .header { border-bottom: 1px solid var(--ohda-border); }

.org-stack {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.org-item {
    font-size: 7pt;
    font-weight: 500;
    color: var(--text-muted);
    line-height: 1.6;
    letter-spacing: 0.1px;
}

.header-id {
    display: flex;
    align-items: center;
    gap: 10px;
}

.pharmacy-name {
    font-size: 10pt;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: -0.2px;
}

.pharmacy-number {
    font-size: 13pt;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    width: 36px;
    height: 36px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: var(--radius-badge);
    flex-shrink: 0;
    letter-spacing: -0.3px;
}

.card.shatb .pharmacy-number {
    background: var(--shatb-badge-bg);
    color: var(--shatb-badge-fg);
    box-shadow: 0 4px 12px var(--shatb-glow);
}

.card.ohda .pharmacy-number {
    background: var(--ohda-badge-bg);
    color: var(--ohda-badge-fg);
    box-shadow: 0 4px 12px var(--ohda-glow);
}

.center-content {
    flex-grow: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 2;
}

.main-text {
    font-family: var(--font-display), 'Amiri', serif;
    font-size: 44pt;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-main);
    letter-spacing: -0.02em;
    text-align: center;
    line-height: 1;
}

body.theme-ledger .main-text { font-size: 41pt; }
body.theme-seal .main-text { font-size: 37pt; letter-spacing: 0; }
body.theme-desert .main-text { font-size: 42pt; }
body.theme-pearl .main-text { font-size: 39pt; }

.footer-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
    z-index: 2;
}

.footer-line {
    display: none;
    width: 44px;
    height: 2px;
    border-radius: 4px;
}

.card.shatb .footer-line {
    background: linear-gradient(to right, transparent, var(--shatb-accent) 28%, var(--shatb-accent) 72%, transparent);
    opacity: 0.5;
}

.card.ohda .footer-line {
    background: linear-gradient(to right, transparent, var(--ohda-accent) 28%, var(--ohda-accent) 72%, transparent);
    opacity: 0.5;
}

.has-line .footer-line { display: block; }

.footer-text {
    font-size: 8.5pt;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
    letter-spacing: -0.1px;
}

.fiscal-year {
    font-size: 7.1pt;
    font-weight: 600;
    color: var(--text-muted);
    opacity: 0.95;
    letter-spacing: 0;
    white-space: nowrap;
}

.editable {
    cursor: text;
    border-radius: 6px;
    transition: background 0.15s var(--ease-out);
}
.editable:hover { background: rgba(0,0,0,0.06); }
body.theme-seal .editable:hover { background: rgba(255,255,255,0.09); }

.inline-edit-input {
    border: none;
    outline: none;
    background: rgba(0,0,0,0.05);
    border-radius: 6px;
    padding: 0 4px;
    font-family: inherit;
}
body.theme-seal .inline-edit-input { background: rgba(255,255,255,0.10); }
.inline-edit-input:focus { box-shadow: 0 0 0 2px var(--panel-accent); }

.fab {
    position: fixed;
    bottom: 26px;
    left: 26px;
    z-index: 210;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    background: var(--panel-accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,0.22), 0 2px 6px rgba(0,0,0,0.12);
    transition: transform 0.25s var(--ease-out), box-shadow 0.25s var(--ease-out);
}
.fab:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 14px 30px rgba(0,0,0,0.26); }
.fab svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 1.8; }

.btn-print {
    position: fixed;
    bottom: 26px;
    left: 94px;
    z-index: 210;
    height: 54px;
    padding: 0 22px;
    border: none;
    border-radius: 100px;
    background: var(--panel-bg);
    color: var(--panel-ink);
    font-family: inherit;
    font-weight: 700;
    font-size: 9.5pt;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,0.14), 0 2px 6px rgba(0,0,0,0.08);
    border: 1px solid var(--panel-line);
    transition: transform 0.25s var(--ease-out);
}
.btn-print:hover { transform: translateY(-2px); }

.panel {
    position: fixed;
    top: 0;
    right: 0;
    height: 100vh;
    width: 380px;
    max-width: 92vw;
    background: var(--panel-bg);
    color: var(--panel-ink);
    z-index: 300;
    box-shadow: -18px 0 50px rgba(0,0,0,0.18);
    transform: translateX(100%);
    transition: transform 0.4s var(--ease-out);
    display: flex;
    flex-direction: column;
}
.panel.open { transform: translateX(0); }

.panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 22px;
    border-bottom: 1px solid var(--panel-line);
    flex-shrink: 0;
}
.panel-title { font-size: 12.5pt; font-weight: 700; }
.panel-close {
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: var(--panel-field); color: var(--panel-ink);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: background 0.2s;
}
.panel-close:hover { background: var(--panel-line); }

.panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 22px 220px;
}

.panel-section { margin-bottom: 18px; }
.panel-section-title {
    font-size: 8.5pt;
    font-weight: 700;
    color: var(--panel-muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 12px;
}

.panel-hint {
    font-size: 8.3pt;
    font-weight: 600;
    color: var(--panel-muted);
    background: var(--panel-field);
    padding: 12px 14px;
    border-radius: 14px;
    line-height: 1.7;
}

.quick-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
}
.quick-filters button {
    padding: 6px 13px;
    border-radius: 100px;
    border: 1px solid var(--panel-line);
    background: var(--panel-field);
    color: var(--panel-ink);
    font-family: inherit;
    font-size: 7.8pt;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
}
.quick-filters button:hover { background: var(--panel-line); }

.card-rows {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
}

.card-row-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 14px;
    border: 1px solid var(--panel-line);
    background: var(--panel-field);
    cursor: pointer;
    transition: border-color 0.15s, opacity 0.15s;
}
.card-row-item.selected { border-color: var(--panel-accent); box-shadow: inset 0 0 0 1px var(--panel-accent); }
.card-row-item.dragging { opacity: 0.4; }
.card-row-item.drag-over { border-style: dashed; border-color: var(--panel-accent); }

.drag-handle {
    cursor: grab;
    color: var(--panel-muted);
    font-size: 12px;
    line-height: 1;
    user-select: none;
    letter-spacing: -2px;
    flex-shrink: 0;
}

.row-type-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: none;
    flex-shrink: 0;
    cursor: pointer;
    padding: 0;
}
.row-type-dot.shatb { background: var(--shatb-accent); }
.row-type-dot.ohda { background: var(--ohda-accent); }

.row-text { flex: 1; min-width: 0; }
.row-center-preview {
    font-size: 9pt;
    font-weight: 700;
    color: var(--panel-ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.row-footer-preview {
    font-size: 7.5pt;
    font-weight: 500;
    color: var(--panel-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.row-icon-actions { display: flex; gap: 2px; flex-shrink: 0; }
.row-icon-actions button {
    width: 24px; height: 24px; border-radius: 8px; border: none;
    background: transparent; color: var(--panel-muted); cursor: pointer;
    font-size: 11px; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
}
.row-icon-actions button:hover { background: var(--panel-line); color: var(--panel-ink); }
.row-line-btn.active { color: var(--panel-accent); font-weight: 900; }

.add-card-btn {
    width: 100%;
    padding: 12px;
    border-radius: 14px;
    border: 1.5px dashed var(--panel-line);
    background: transparent;
    color: var(--panel-muted);
    font-family: inherit;
    font-weight: 700;
    font-size: 9pt;
    cursor: pointer;
    transition: all 0.15s;
}
.add-card-btn:hover { border-color: var(--panel-accent); color: var(--panel-accent); background: rgba(0,0,0,0.02); }

.batch-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--panel-bg);
    border-top: 1px solid var(--panel-line);
    padding: 0 18px;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s var(--ease-out), opacity 0.25s, padding 0.3s;
}
.batch-bar.active {
    max-height: 280px;
    opacity: 1;
    padding: 16px 18px;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.10);
}
.batch-count { font-size: 8pt; font-weight: 800; color: var(--panel-accent); margin-bottom: 10px; }
.batch-row { display: flex; gap: 8px; margin-bottom: 8px; }
.batch-row:last-child { margin-bottom: 0; }
.batch-row .type-toggle { flex: 1; display: flex; gap: 8px; }
.batch-type-btn, .batch-line-btn {
    flex: 1; border: none; background: var(--panel-field); padding: 8px 6px;
    border-radius: 10px; font-family: inherit; font-size: 7.6pt; font-weight: 700;
    color: var(--panel-ink); cursor: pointer; transition: background 0.15s;
}
.batch-type-btn:hover, .batch-line-btn:hover { background: var(--panel-line); }
.batch-row input[type="text"] {
    flex: 1; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--panel-line);
    background: var(--panel-field); color: var(--panel-ink); font-family: inherit;
    font-size: 8.5pt; outline: none;
}
#batchFooterApply {
    border: none; background: var(--panel-accent); color: #fff; padding: 8px 16px;
    border-radius: 10px; font-family: inherit; font-weight: 700; font-size: 8pt; cursor: pointer;
}
.batch-action {
    flex: 1; border: none; padding: 9px; border-radius: 10px; font-family: inherit;
    font-weight: 700; font-size: 8pt; cursor: pointer; background: var(--panel-field); color: var(--panel-ink);
}
.batch-action:hover { background: var(--panel-line); }
.batch-action.danger { background: rgba(211,30,73,0.12); color: #B01A3E; }
body.theme-seal .batch-action.danger { background: rgba(255,90,110,0.18); color: #FF8FA3; }

@media print {
    @page { size: 297mm 210mm; margin: 0; }
    html, body { width: 297mm; height: auto; margin: 0; padding: 0; }
    body { background: #ffffff; gap: 0; display: block; }
    .no-print { display: none !important; }
    .editable:hover { background: none !important; }
    .page {
        width: 297mm; height: 210mm; margin: 0; border: 0; border-radius: 0;
        box-shadow: none; page-break-after: always; break-after: page;
    }
    .page:last-child { page-break-after: auto; break-after: auto; }
    .card { box-shadow: none !important; border: 1px solid rgba(0,0,0,0.12) !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}
</style>
</head>
<body class="theme-ledger">

<div class="theme-switcher no-print">
<div class="theme-indicator"></div>
<button class="theme-btn active" onclick="setTheme('theme-ledger', this)">دفتري</button>
<button class="theme-btn" onclick="setTheme('theme-seal', this)">ختم</button>
<button class="theme-btn" onclick="setTheme('theme-desert', this)">صحراء</button>
<button class="theme-btn" onclick="setTheme('theme-pearl', this)">لؤلؤي</button>
</div>

<button class="fab no-print" id="fabBtn" title="تنظيم البطاقات">
<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
</button>
<button class="btn-print no-print" id="printBtn">طباعة</button>

<div class="panel no-print" id="panel">
<div class="panel-head">
<div class="panel-title">تنظيم البطاقات</div>
<button class="panel-close" id="panelClose">✕</button>
</div>
<div class="panel-body" id="panelBody"></div>
<div class="batch-bar" id="batchBar"></div>
</div>

<div id="pagesRoot"></div>

<script>
const state = {
    org: [
        "الهيئة العامة للتأمين الصحي",
        "فرع البحيرة - ادارة المنطقة الثانية",
        "عيادة دمنهور الشاملة"
    ],
    pharmacyName: "صيدلية دمنهور الشاملة",
    pharmacyNumber: "2",
    fiscalYear: "عن العام المالي 2026-2027",
    cards: [
        { type: "shatb", center: "114 شطب", footer: "نموذج 5 م.ح", hasLine: false, selected: false },
        { type: "shatb", center: "شطب A", footer: "دفتر 322", hasLine: false, selected: false },
        { type: "shatb", center: "شطب B", footer: "دفتر 322", hasLine: false, selected: false },
        { type: "shatb", center: "شطب C", footer: "دفتر 322", hasLine: false, selected: false },
        { type: "shatb", center: "شطب A", footer: "سجل 4 م.ح", hasLine: false, selected: false },
        { type: "shatb", center: "شطب B", footer: "سجل 4 م.ح", hasLine: false, selected: false },
        { type: "shatb", center: "شطب C", footer: "سجل 4 م.ح", hasLine: false, selected: false },
        { type: "ohda", center: "114 عهدة", footer: "نموذج 5 م.ح", hasLine: false, selected: false },
        { type: "ohda", center: "عهدة A", footer: "دفتر 322", hasLine: false, selected: false },
        { type: "ohda", center: "عهدة B", footer: "دفتر 322", hasLine: false, selected: false },
        { type: "ohda", center: "عهدة C", footer: "دفتر 322", hasLine: false, selected: false },
        { type: "ohda", center: "عهدة A", footer: "سجل 3 م.ح", hasLine: true, selected: false },
        { type: "ohda", center: "عهدة B", footer: "سجل 3 م.ح", hasLine: true, selected: false },
        { type: "ohda", center: "عهدة C", footer: "سجل 3 م.ح", hasLine: true, selected: false }
    ]
};

let dragSrcIdx = null;

function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

function cardHTML(item, idx) {
    const wm = item.type === "shatb" ? "ش" : "ع";
    return `
    <div class="card ${item.type}">
        <div class="wm">${wm}</div>
        <div class="header">
            <div class="org-stack">
                <div class="org-item editable" data-field="orgLine" data-line="0">${escapeHTML(state.org[0])}</div>
                <div class="org-item editable" data-field="orgLine" data-line="1">${escapeHTML(state.org[1])}</div>
                <div class="org-item editable" data-field="orgLine" data-line="2">${escapeHTML(state.org[2])}</div>
            </div>
            <div class="header-id">
                <div class="pharmacy-name editable" data-field="pharmacyName">${escapeHTML(state.pharmacyName)}</div>
                <div class="pharmacy-number editable" data-field="pharmacyNumber">${escapeHTML(state.pharmacyNumber)}</div>
            </div>
        </div>
        <div class="center-content">
            <div class="main-text editable" data-field="center" data-idx="${idx}">${escapeHTML(item.center)}</div>
        </div>
        <div class="footer-wrapper ${item.hasLine ? "has-line" : ""}">
            <div class="footer-line"></div>
            <div class="footer-text editable" data-field="footer" data-idx="${idx}">${escapeHTML(item.footer)}</div>
            <div class="fiscal-year editable" data-field="fiscalYear">${escapeHTML(state.fiscalYear)}</div>
        </div>
    </div>`;
}

function renderPages() {
    const root = document.getElementById('pagesRoot');
    root.innerHTML = "";
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < state.cards.length; i += 4) {
        const page = document.createElement("div");
        page.className = "page";
        const group = state.cards.slice(i, i + 4);
        group.forEach((item, j) => {
            page.insertAdjacentHTML("beforeend", cardHTML(item, i + j));
        });
        fragment.appendChild(page);
    }
    root.appendChild(fragment);
}

function getFieldValue(field, idx, line) {
    if (field === 'orgLine') return state.org[line];
    if (field === 'pharmacyName') return state.pharmacyName;
    if (field === 'pharmacyNumber') return state.pharmacyNumber;
    if (field === 'fiscalYear') return state.fiscalYear;
    if (field === 'center') return state.cards[idx].center;
    if (field === 'footer') return state.cards[idx].footer;
    return "";
}

function setFieldValue(field, idx, line, val) {
    if (field === 'orgLine') state.org[line] = val;
    else if (field === 'pharmacyName') state.pharmacyName = val;
    else if (field === 'pharmacyNumber') state.pharmacyNumber = val;
    else if (field === 'fiscalYear') state.fiscalYear = val;
    else if (field === 'center') state.cards[idx].center = val;
    else if (field === 'footer') state.cards[idx].footer = val;
}

function beginEdit(el) {
    const field = el.dataset.field;
    const idx = el.dataset.idx !== undefined ? +el.dataset.idx : null;
    const line = el.dataset.line !== undefined ? +el.dataset.line : null;
    const current = getFieldValue(field, idx, line);
    const cs = getComputedStyle(el);
    const input = document.createElement('input');
    input.type = 'text';
    input.value = current;
    input.className = 'inline-edit-input';
    input.style.fontFamily = cs.fontFamily;
    input.style.fontSize = cs.fontSize;
    input.style.fontWeight = cs.fontWeight;
    input.style.color = cs.color;
    input.style.textAlign = cs.textAlign;
    input.style.letterSpacing = cs.letterSpacing;
    input.style.direction = 'rtl';
    input.style.width = Math.max(el.offsetWidth + 24, 48) + 'px';

    const commit = () => {
        setFieldValue(field, idx, line, input.value);
        renderPages();
        if (document.getElementById('panel').classList.contains('open')) renderPanel();
    };

    input.addEventListener('blur', commit, { once: true });
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            e.preventDefault();
            input.blur();
        } else if (e.key === 'Escape') {
            e.preventDefault();
            input.removeEventListener('blur', commit);
            renderPages();
        }
    });

    el.replaceWith(input);
    input.focus();
    input.select();
}

function updateBatchBar() {
    const bar = document.getElementById('batchBar');
    const sel = state.cards.filter(c => c.selected);
    if (sel.length === 0) {
        bar.classList.remove('active');
        bar.innerHTML = '';
        return;
    }
    bar.classList.add('active');
    bar.innerHTML = `
        <div class="batch-count">${sel.length} بطاقة محددة</div>
        <div class="batch-row">
            <div class="type-toggle">
                <button type="button" class="batch-type-btn" data-type="shatb">تحويل لشطب</button>
                <button type="button" class="batch-type-btn" data-type="ohda">تحويل لعهدة</button>
            </div>
        </div>
        <div class="batch-row">
            <div class="type-toggle">
                <button type="button" class="batch-line-btn" data-line="show">إظهار الخط</button>
                <button type="button" class="batch-line-btn" data-line="hide">إخفاء الخط</button>
            </div>
        </div>
        <div class="batch-row">
            <input type="text" id="batchFooterInput" placeholder="نص أسفل البطاقة للمحدد">
            <button type="button" id="batchFooterApply">تطبيق</button>
        </div>
        <div class="batch-row">
            <button type="button" class="batch-action" id="batchDuplicate">تكرار المحدد</button>
            <button type="button" class="batch-action danger" id="batchDelete">حذف المحدد</button>
        </div>
    `;

    bar.querySelectorAll('.batch-type-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            state.cards.forEach(c => { if (c.selected) c.type = btn.dataset.type; });
            renderPanel();
            renderPages();
        });
    });
    bar.querySelectorAll('.batch-line-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const show = btn.dataset.line === 'show';
            state.cards.forEach(c => { if (c.selected) c.hasLine = show; });
            renderPanel();
            renderPages();
        });
    });
    const applyFooter = () => {
        const val = document.getElementById('batchFooterInput').value;
        if (!val) return;
        state.cards.forEach(c => { if (c.selected) c.footer = val; });
        renderPanel();
        renderPages();
    };
    document.getElementById('batchFooterApply').addEventListener('click', applyFooter);
    document.getElementById('batchFooterInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); applyFooter(); }
    });
    document.getElementById('batchDuplicate').addEventListener('click', () => {
        const next = [];
        state.cards.forEach(c => {
            next.push(c);
            if (c.selected) next.push(Object.assign({}, c, { selected: false }));
        });
        state.cards.forEach(c => c.selected = false);
        state.cards = next;
        renderPanel();
        renderPages();
    });
    document.getElementById('batchDelete').addEventListener('click', () => {
        state.cards = state.cards.filter(c => !c.selected);
        renderPanel();
        renderPages();
    });
}

function renderPanel() {
    const body = document.getElementById('panelBody');
    body.innerHTML = `
        <div class="panel-section">
            <div class="panel-hint">انقر على أي نص داخل البطاقة لتعديله مباشرة</div>
        </div>
        <div class="panel-section">
            <div class="panel-section-title">تنظيم البطاقات (${state.cards.length})</div>
            <div class="quick-filters">
                <button type="button" data-q="all">تحديد الكل</button>
                <button type="button" data-q="shatb">شطب فقط</button>
                <button type="button" data-q="ohda">عهدة فقط</button>
                <button type="button" data-q="none">إلغاء التحديد</button>
            </div>
            <div class="card-rows" id="cardRows"></div>
            <button class="add-card-btn" id="addCardBtn" type="button">+ إضافة بطاقة</button>
        </div>
    `;

    const rowsHost = document.getElementById('cardRows');
    state.cards.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'card-row-item' + (item.selected ? ' selected' : '');
        row.draggable = true;
        row.dataset.idx = idx;
        row.innerHTML = `
            <span class="drag-handle">⋮⋮</span>
            <button type="button" class="row-type-dot ${item.type}" title="تبديل النوع"></button>
            <div class="row-text">
                <div class="row-center-preview">${escapeHTML(item.center) || 'بدون نص'}</div>
                <div class="row-footer-preview">${escapeHTML(item.footer)}</div>
            </div>
            <div class="row-icon-actions">
                <button type="button" class="row-line-btn ${item.hasLine ? 'active' : ''}" title="خط فاصل">―</button>
                <button type="button" class="row-dup-btn" title="تكرار">⧉</button>
                <button type="button" class="row-del-btn" title="حذف">✕</button>
            </div>
        `;
        rowsHost.appendChild(row);

        row.addEventListener('click', e => {
            if (e.target.closest('button')) return;
            state.cards[idx].selected = !state.cards[idx].selected;
            renderPanel();
        });
        row.addEventListener('dragstart', () => {
            dragSrcIdx = idx;
            row.classList.add('dragging');
        });
        row.addEventListener('dragend', () => {
            dragSrcIdx = null;
            document.querySelectorAll('.card-row-item').forEach(r => r.classList.remove('dragging', 'drag-over'));
        });
        row.addEventListener('dragover', e => {
            e.preventDefault();
            row.classList.add('drag-over');
        });
        row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
        row.addEventListener('drop', e => {
            e.preventDefault();
            row.classList.remove('drag-over');
            if (dragSrcIdx === null || dragSrcIdx === idx) return;
            const [moved] = state.cards.splice(dragSrcIdx, 1);
            state.cards.splice(idx, 0, moved);
            dragSrcIdx = null;
            renderPanel();
            renderPages();
        });
        row.querySelector('.row-type-dot').addEventListener('click', e => {
            e.stopPropagation();
            state.cards[idx].type = state.cards[idx].type === 'shatb' ? 'ohda' : 'shatb';
            renderPanel();
            renderPages();
        });
        row.querySelector('.row-line-btn').addEventListener('click', e => {
            e.stopPropagation();
            state.cards[idx].hasLine = !state.cards[idx].hasLine;
            renderPanel();
            renderPages();
        });
        row.querySelector('.row-dup-btn').addEventListener('click', e => {
            e.stopPropagation();
            const copy = Object.assign({}, state.cards[idx], { selected: false });
            state.cards.splice(idx + 1, 0, copy);
            renderPanel();
            renderPages();
        });
        row.querySelector('.row-del-btn').addEventListener('click', e => {
            e.stopPropagation();
            state.cards.splice(idx, 1);
            renderPanel();
            renderPages();
        });
    });

    document.querySelectorAll('.quick-filters button').forEach(btn => {
        btn.addEventListener('click', () => {
            const q = btn.dataset.q;
            if (q === 'all') state.cards.forEach(c => c.selected = true);
            else if (q === 'none') state.cards.forEach(c => c.selected = false);
            else state.cards.forEach(c => c.selected = c.type === q);
            renderPanel();
        });
    });

    document.getElementById('addCardBtn').addEventListener('click', () => {
        state.cards.push({ type: "shatb", center: "بطاقة جديدة", footer: "", hasLine: false, selected: false });
        renderPanel();
        renderPages();
    });

    updateBatchBar();
}

function moveIndicator(btn) {
    const indicator = document.querySelector('.theme-indicator');
    const parentRect = btn.parentElement.getBoundingClientRect();
    const rect = btn.getBoundingClientRect();
    indicator.style.width = rect.width + 'px';
    indicator.style.transform = `translateX(${rect.left - parentRect.left}px)`;
}

function setTheme(n, b) {
    document.body.className = n;
    document.querySelectorAll('.theme-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    moveIndicator(b);
}

window.addEventListener('load', () => moveIndicator(document.querySelector('.theme-btn.active')));
window.addEventListener('resize', () => moveIndicator(document.querySelector('.theme-btn.active')));

document.getElementById('fabBtn').addEventListener('click', () => {
    document.getElementById('panel').classList.add('open');
});
document.getElementById('panelClose').addEventListener('click', () => {
    document.getElementById('panel').classList.remove('open');
});
document.getElementById('printBtn').addEventListener('click', () => {
    if (document.activeElement && document.activeElement.classList.contains('inline-edit-input')) {
        document.activeElement.blur();
    }
    window.print();
});
document.getElementById('pagesRoot').addEventListener('click', e => {
    const el = e.target.closest('.editable');
    if (!el) return;
    beginEdit(el);
});

renderPages();
renderPanel();
</script>
</body>
</html>
